# Manifest — cumple core/contracts/workflow-manifest.md (v1)
#
# El pipeline N+1 (ADR-055), y el test real del invariante #3 de PLAN §F5: si LinkedIn entra sin
# tocar el núcleo más allá de su propia migración, "clonar y configurar" deja de ser una promesa.
#
# ⚠️ ESTADO REAL, 2026-08-11 — leelo antes de creerle a las etapas de abajo.
#   Existen: los ADRs (055/056/066/067/068), las tablas (`core/schema/020_pipeline_linkedin.sql`), el
#   cockpit con sus 4 pantallas, la fachada sirviendo el plan de este pipeline (ADR-068) y el
#   `workflow.json` con **16 nodos**: los 11 de infraestructura (2 triggers, Config, barrido de
#   zombies, guard single-flight, apertura y cierre del run, lectura del plan fail-closed) más la
#   **espina del carril personal** — `Colectar (stub personal)` → `Calidad (R-1 + R-2)` →
#   `Preparar candidatos` → `POST Candidatos`, con `Verificar plan (ADR-068)` al frente.
#
#   🔴 DOS COSAS QUE NO SON LO QUE PARECEN:
#     1. **`Colectar` es un STUB**: emite piezas FIJAS, no lee nada. Existe para probar el cableado
#        (tenant, FK, RLS, dedup, R-1, R-2, PostgREST) antes de gastar un peso. Lo reemplaza la
#        Fase 1.4 de `docs/agents/plan-motor-linkedin.md`.
#     2. **En n8n vive todavía el esqueleto de 11 nodos.** Estos 5 son topología nueva, y la
#        topología no entra por `n8n:push`. Hasta que alguien la aplique, `n8n:diff` grita — y eso
#        es correcto, no un bug.
#
#   Sigue **INACTIVO y sin cron**, y sigue en `status: draft`: `generar` está bloqueada por los
#   few-shot y `colectar` copiable por el banco de referentes. Ninguno de los dos bloqueos es
#   técnico (ADR-055 §Consecuencias) y ninguna sesión de código los mueve.
contract_version: 1

id: linkedin
name: "Máquina de LinkedIn — referentes y texto, con fotos"
description: >
  Detecta contenido que ya funcionó —incluido el de otros idiomas— por dos carriles: el archivo
  propio de la voz (anécdotas que nadie más tiene) y material ajeno de Pinterest y referentes en
  inglés (formatos para rebrandear). Un humano cura qué entra, la máquina produce el post en la voz
  de la cuenta con su firma obligatoria, y lo deja en una cola para que una persona lo apruebe y
  publique. NADIE publica solo: en un canal que no quiere ser automatizado el costo de equivocarse
  es la cuenta, no un reintento.
engine: n8n
status: draft
owner: alejo

triggers:
  # Sin cron acá, y no es un olvido: los crons viven en el dispatcher desde la Fase 4 (ADR-050). Un
  # cron local no tendría de dónde sacar la instancia y solo produciría corridas que abortan después
  # de `Abrir run`, dejando la fila en `en_curso` para siempre — el fallo mudo que ya costó una
  # sesión, una vez por semana.
  - type: webhook               # POST con { instancia } en el body, del dispatcher o del botón ▶.
                                # Guard single-flight POR INSTANCIA, header auth, path aleatorio:
                                # el mismo patrón de los otros cuatro. Path = <<WEBHOOK_PATH_LINKEDIN>>.
  - type: manual                # "Execute Workflow" para probar. Sin payload: se le pega el uuid de
                                # la instancia a la expresión de Config.instance_id. Vacío ⇒ 400.

inputs:
  # La config NO se edita en el nodo: se lee por la fachada (ADR-035, "n8n lee su config por la
  # fachada, escribe sus resultados por PostgREST").
  #
  # ⚠️ `client_config` decía `clients/{cliente}/linkedin.yaml` y ese archivo **no existe ni va a
  # existir**: desde ADR-035 la config de una instancia sale de Postgres por la fachada, y un yaml
  # por cliente sería una segunda fuente de verdad para lo mismo. Se declara `n/a`, como ya hacen el
  # dispatcher y el registro de fallos. (Los manifests de `short-form-content`,
  # `descubrimiento-referentes` y `archivado` siguen declarando el suyo y tampoco existe — misma
  # herencia del diseño pre-fachada, sin consecuencia porque nadie los lee.)
  client_config: "n/a — la config sale de la fachada (ADR-035); no hay yaml por cliente"
  config_node: "Nodo 'Config': supabase_url, dashboard_url. instance_id sale del payload (ADR-048)."
  # 🔴 Decía `&ambito=linkedin` y eso daba **400**: `ambito` es motor|completo y nada más. El
  # pipeline NO se pide, lo DERIVA la fachada de la instancia (ADR-068) — son dos ejes: qué pipeline
  # (lo sabe la base) y cuán filtrado (lo pide quien llama).
  run_plan: "GET /api/engine/run-plan?instancia=<uuid> — devuelve `pipeline: linkedin`, las voces CON PERFIL (ADR-067: el perfil es el interruptor, no `voces.activo`) y el banco de referentes prendido. Sin `proyectos` y sin `ajustes`: ver ADR-068."
  filters:
    # ⚠️ NINGUNA de estas perillas existe todavía en `app.ajustes` (es de grano instancia y LinkedIn
    # no tiene filas), y por eso el plan de corrida NO trae `ajustes`. Las crea la Fase 4 con su
    # su migración (la próxima libre de `core/schema/` — la `028` se la llevó ADR-069); hasta
    # entonces viven acá como diseño y el motor las lleva en su `Config`.
    # El umbral es POR CARRIL, y esa es la diferencia estructural con reels (ADR-055 §2).
    - { key: umbral_reacciones, type: number, scope: client, desc: "Carril copiable, fuente LinkedIn: piso de reacciones. NO aplica al carril personal, que no compite con nadie" }
    - { key: pins_por_consulta, type: number, scope: client, default: 20, desc: "Carril copiable, fuente Pinterest: cuántos pins traer por filtro. Acá el umbral es de pertinencia y formato, no de viralidad — un pin no tiene reacciones que comparar" }
    - { key: dias_recencia,     type: number, scope: client, default: 30, desc: "Ventana de fetch" }
    - { key: n_por_voz,         type: number, scope: client, desc: "Candidatos por voz al feed. Una sola perilla de cantidad (ADR-038)" }
    - { key: ventana_corrida_min, type: number, scope: client, default: 60, desc: "Single-flight por instancia (ADR-023): un run 'en_curso' más joven que esto es corrida viva. Tiene que quedar POR ENCIMA de la corrida más larga posible" }
  credentials:                  # SOLO NOMBRES — los valores viven en n8n / gestor, JAMÁS en git
    - apify_token               # scrape de Pinterest y de las fuentes del carril copiable
    - anthropic_api_key         # gate de relevancia + generación en voz
    - supabase_service_role     # credencial n8n 'Supabase account'
    - webhook_motor_header      # credencial n8n 'Webhook Motor Header' — protege el trigger
    - run_plan_header           # credencial n8n 'Run Plan Header' — la fachada
  # NINGUNA credencial de LinkedIn: la máquina no publica (ADR-055 §5). Y ninguna de Supadata:
  # no hay nada que transcribir.

stages:                         # las 8 etapas canónicas de PLAN §2.4 (n/a si no aplica)
  colectar: >
    [STUB, Fase 1.1] Bifurcada en dos carriles (ADR-055 §2). Copiable: Apify sobre Pinterest (por
    filtro) y sobre las fuentes en inglés del banco (app.referentes_linkedin) — [POR CONSTRUIR],
    bloqueada porque el banco NO EXISTE en ninguna marca. Personal: el archivo propio de la voz —
    hoy es `Colectar (stub personal)`, que emite piezas FIJAS y no lee ninguna fila. El stub existe
    para que la cadena entera corra y se verifique antes de gastar en Apify o en un LLM: si la
    pieza aparece en el Feed, lo que falta es contenido, no cableado. La Fase 1.4 lo reemplaza por
    la lectura real de las filas `fuente: archivo`, y antes de escribirla hay que cerrar cómo entra
    ese archivo (un podcast es audio y `enriquecer` es n/a: no hay transcripción).
  normalizar: >
    [POR CONSTRUIR] Pins y posts → content_item, el formato común que ya especifica
    core/contracts/schemas/. Cada pieza carga su `carril` y su `fuente`: no son etiquetas
    descriptivas, deciden qué umbral se le aplica y qué trabajo tiene después.
  filtrar_scorear: >
    [POR CONSTRUIR] Umbral por carril: el copiable-LinkedIn mide reacciones, el copiable-Pinterest
    mide pertinencia y formato (un pin no tiene con qué comparar), y el personal no mide nada porque
    no compite. Dedup contra app.candidatos_linkedin por (instance_id, external_id) — scopeado, que
    es la lección más cara del refactor multi-tenant: el unique global le vacía el supply a la
    segunda empresa sin un solo error.
  enriquecer: n/a               # LinkedIn ya es texto. Es la declaración que ADR-049 §4 pedía como
                                # afirmación verificable, y tiene consecuencia en la superficie: la
                                # zona `transcribir` no existe en este cockpit (ADR-056).
  generar: >
    [POR CONSTRUIR — bloqueado] Claude con el perfil de voz + 2 a 4 posts reales como few-shot +
    cache_control, el patrón que ya funciona en reels. En el carril copiable la imagen NO se genera:
    se REBRANDEA (paleta de la marca, traducción al español, firma al pie).
    🔴 Bloqueado por el pedido más barato del proyecto y que sigue sin hacerse: 3–4 posts que se
    sientan perfectos, POR CUENTA. Sin ellos la generación sale genérica. La firma NO es uno de esos
    insumos: sale del plan (voces[].fields.firma) y la impone `calidad`, no el prompt.
    ⚠️ Este renglón decía "que Fernando sienta perfectos" y estaba mal (corregido el 2026-08-11):
    Fernando dio la idea general de cómo funciona la máquina, no el molde que se copia. Los few-shot
    anclan la voz de UNA CUENTA, así que el pedido es de quien manda esa cuenta.
  calidad: >
    [HECHO, Fase 1.2] Nodo `Calidad (R-1 + R-2)`. El validador determinista de ADR-055 §4, que corre
    DESPUÉS del LLM y antes de que nada llegue a un humano: R-1 (el gancho es un bloque continuo de
    2–3 líneas sin línea en blanco — un \n\n antes de la línea 2 esconde el post detrás del "ver
    más") y R-2 (firma obligatoria al cierre, sin excepción). Las dos se imponen a todas las voces y
    son código, no prompt. R-3 y R-4 no se validan acá: son placeholders de la voz.
    🔑 Las dos reglas se tratan distinto según quién sea dueño del texto: R-1 RECHAZA (el gancho es
    contenido, código no puede inventar uno) y R-2 REPARA agregando la firma de la voz al cierre (es
    texto de la casa). Si la firma aparece en el medio se rechaza: agregarla la duplicaría y moverla
    ya es reescribir. Un rechazo de calidad NO va a app.descartes_linkedin —esa tabla es para los
    near-miss del gate (ADR-036)— sino a runs.metricas: es una falla de generación, no un falso
    negativo de curación. Se escribió ANTES que `generar` a propósito, contra texto de prueba, para
    que el día que entre el LLM ya tenga quién lo sanitice. Tests: test-nodos.mjs.
  entregar: >
    [PARCIAL, Fase 1.1] `Preparar candidatos` → `POST Candidatos`: filas a app.candidatos_linkedin
    por PostgREST (ADR-035) con estado 'nuevo', el instance_id del payload (ADR-048) y
    `resolution=ignore-duplicates` sobre el unique (instance_id, external_id). El POST es fail-closed
    (es LA entrega, no el registro) y el cierre del run cuelga de `Calidad` en la rama HERMANA, no
    detrás del POST: sin eso, una corrida sin piezas —hoy, con 0 voces, todas— dejaría el run
    `en_curso` hasta el barrido siguiente.
    [POR CONSTRUIR] Los descartes borderline a app.descartes_linkedin, que llegan con la Fase 2.6
    junto con el gate que los produce.
  notificar: n/a                # el equipo vive en el cockpit; no hay email

outputs:
  - type: post_linkedin
    destination_native: postgres      # app.candidatos_linkedin (ADR-049: un pipeline, sus tablas)
    registered: pending               # el run se abre y se cierra en `runs` con su embudo en
                                      # `metricas`; lo que todavía NO se escribe es una fila en
                                      # `outputs`, porque una pieza sin publicar no es una entrega.

runbook:
  setup: >
    Aplicar core/schema/020_pipeline_linkedin.sql (registra el pipeline en `workflows` y crea las 4
    tablas) → crear la instancia: insert into instances (client_id, workflow_id, slug, nombre) →
    importar el workflow.json en n8n → reemplazar <<WEBHOOK_PATH_LINKEDIN>> → enganchar las
    credenciales (ver la tabla nodo→credencial del handoff: los nodos de `fachada` primero, son los
    que rompen al arrancar) → agregar el cron de este pipeline al dispatcher → ACTIVAR.
  start: "Lo dispara el dispatcher y el botón ▶ del cockpit. Acá solo hay que dejarlo ACTIVO."
  stop: "Desactivar el workflow en n8n."
  test: >
    Antes de que exista el workflow.json, lo que sí se verifica es el cockpit: crear una instancia
    de linkedin y comprobar que /<empresa>/<slug> abre en `curar`, que el nav dibuja SOLO `curar` y
    `ajustes`, y que entrar a mano a /<empresa>/<slug>/{transcribir,operar,entender} redirige
    (ADR-056: la UI esconde, el servidor impide). Desde ADR-066 `operar` y `entender` tampoco se
    declaran: no tienen pantalla propia, y `operar` traía los tres botones que disparan los
    workflows de REELS. Cuando este workflow exista y `operar` vuelva, la guarda por pipeline de
    `operar/actions.ts` NO se saca — ahí está el porqué escrito.
  docs:
    - README.md
    - ../../docs/adr/ADR-055-linkedin-es-un-pipeline-de-este-repo.md
    - ../../docs/adr/ADR-056-las-zonas-son-rol-interseccion-pipeline.md
    - ../../docs/adr/ADR-066-un-cockpit-sin-motor-solo-muestra-lo-que-se-configura.md

cost_per_run: >
  Por medir. Estructuralmente más barato que reels: no hay transcripción (Supadata sale del todo) y
  la traducción es de texto corto, no de 170 transcripciones. El costo dominante pasa a ser el
  scrape de Apify más una llamada de gate y una de generación por pieza que sobrevive.
